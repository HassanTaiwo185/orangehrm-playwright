name: OrangeHRM E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npm install -D playwright@1.44.0

      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libgbm1 libnss3 libxss1

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      - name: Run stable tests on Chrome
        run: npm run test:stable
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ESS_USERNAME: ${{ secrets.ESS_USERNAME }}
          ESS_PASSWORD: ${{ secrets.ESS_PASSWORD }}
          BROWSER: chromium
          HEADLESS: true

      - name: Run stable tests on Firefox
        run: BROWSER=firefox npm run test:stable
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ESS_USERNAME: ${{ secrets.ESS_USERNAME }}
          ESS_PASSWORD: ${{ secrets.ESS_PASSWORD }}
          HEADLESS: true

      - name: Install Java for Allure
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30